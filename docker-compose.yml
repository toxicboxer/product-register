version: '3'

volumes:
  db-data:

services:
    web:
      build: .
      user: root
      ports:
        - '3000:3000'
      volumes:
        - '.:/rails'
      tty: true
      stdin_open: true
      environment:
        - 'RAILS_ENV=development'
        - 'DATABASE_PASSWORD=postgres'
      depends_on:
        - db
      links:
        - db

    db:
      image: postgres:16
      volumes:
        - 'db-data:/var/lib/postgresql/data'
      environment:
        POSTGRES_PASSWORD: postgres
