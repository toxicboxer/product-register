name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker compose up --build -d

      - name: Create database
        run: docker compose exec -T -e RAILS_ENV=test web bundle exec rails db:create

      - name: Run migrations
        run: docker compose exec -T -e RAILS_ENV=test web bundle exec rails db:migrate

      - name: Run tests
        run: docker compose exec -T -e RAILS_ENV=test web bundle exec rails test